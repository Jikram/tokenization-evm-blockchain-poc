# .github/workflows/deploy-with-1password.yml
#
# Sample CI workflow showing how to deploy this POC with all secrets fetched
# from 1Password instead of stored in GitHub Actions secrets.
#
# This workflow is DISABLED by default (`if: false` on the main job) — it's a
# reference for the team. To enable it:
#   1. In 1Password, create a Service Account with read-only access to the
#      "Tokenization POC - EVM Smart Contracts" vault.
#   2. In GitHub repo settings → Secrets and variables → Actions, add a single
#      secret: `OP_SERVICE_ACCOUNT_TOKEN` = the service account's token.
#   3. Remove the `if: false` line below.
#
# After that, the only secret in GitHub Actions is the service account token.
# Every other secret (private key, RPC URL, etc.) lives in 1Password and is
# rotated there.

name: Deploy contracts via 1Password

on:
    workflow_dispatch: # manual trigger only — never run on push
    # push:
    #   branches: [main]
    #   paths: ['contracts/**']

jobs:
    deploy:
        if: false # ← remove this line to enable the workflow
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: recursive # forge install uses git submodules

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@v1

            - name: Install 1Password CLI
              uses: 1password/install-cli-action@v1

            # Resolve op:// references from the env file and expose them
            # to subsequent steps as ordinary env vars.
            - name: Load secrets from 1Password
              uses: 1password/load-secrets-action@v2
              with:
                  export-env: true
              env:
                  OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
                  PRIVATE_KEY: op://Tokenization POC - EVM Smart Contracts/Sepolia Deployer/private_key
                  SEPOLIA_RPC_URL: op://Tokenization POC - EVM Smart Contracts/Alchemy Sepolia/url
                  ETHERSCAN_API_KEY: op://Tokenization POC - EVM Smart Contracts/Etherscan API/api_key

            - name: Build & test
              working-directory: contracts
              run: |
                  forge build
                  forge test -vv

            - name: Deploy to Sepolia
              run: bash scripts/deploy-full.sh --skip-checks
              # PRIVATE_KEY, SEPOLIA_RPC_URL, ETHERSCAN_API_KEY are already in
              # the environment thanks to the load-secrets step above.

            - name: Upload deploy log
              uses: actions/upload-artifact@v4
              with:
                  name: deploy-log
                  path: /tmp/evm-poc-deploy.log
